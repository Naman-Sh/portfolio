html,body{margin:0;height:100%;background:#0E1512;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;color:#D5E0D9;-webkit-font-smoothing:antialiased}
#stage{position:relative;width:min(100vw,calc(100vh * 1600 / 1200));aspect-ratio:1600 / 1200;overflow:hidden;background:#0E1512;--u:1}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.abs{position:absolute;white-space:nowrap}
.mono{font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.06em;font-weight:400}
.serif{font-family:'Newsreader',serif;font-weight:400;letter-spacing:-.005em}
.serif i{font-style:italic}
.sans{font-family:'IBM Plex Sans',sans-serif}
.ui{position:absolute;right:calc(var(--u)*40px);bottom:calc(var(--u)*34px);display:flex;gap:calc(var(--u)*18px);align-items:center;font-size:calc(var(--u)*24px);color:#8FB8A6}
.ui button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:#E8EFEA;background:#142019;border:calc(var(--u)*2px) solid #2E4238;border-radius:calc(var(--u)*10px);padding:calc(var(--u)*8px) calc(var(--u)*18px);cursor:pointer}
.ui button:hover{border-color:#C6F432;color:#C6F432}
body.export .ui{display:none}
svg{display:block;width:100%;height:100%;user-select:none}
.card,.itile,.tile,.tab,.crumb{cursor:pointer}
.card rect.b,.itile rect.b,.tile rect.b,.tab rect.b{transition:stroke .2s}
.card:hover rect.b,.tab:hover rect.b{stroke:#A8EC4F}
.itile:hover rect.b,.tile:hover rect.b{stroke:#E8EFEA}
.crumb:hover rect{stroke:#A8EC4F}
.ring{pointer-events:none}
.in{animation:fin .4s ease both}
.inl{animation:sl .4s cubic-bezier(.2,.8,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}
